# Triggers an OpenShift build (Docker strategy) on push to main — same pattern as workbc-mobile-api,
# with a maintained login action, optional manual run, and --wait so failed builds fail the workflow.

name: CD

on:
    push:
        branches: [main, test-cicd-pipelines]
    workflow_dispatch:

concurrency:
    group: cd-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    openshift-build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Log in to OpenShift
              uses: redhat-actions/oc-login@v4
              with:
                  openshift_server_url: ${{ secrets.OCP4_SERVER_URL }}
                  openshift_token: ${{ secrets.API_TOKEN }}
                  insecure_skip_tls_verify: true

            - name: Start build (tools namespace)
              run: |
                  set -euo pipefail
                  oc start-build workbc-mobile-app-analytics --wait --follow -n "${{ secrets.PROJECT_TOOLS }}"
