apiVersion: template.openshift.io/v1
kind: Template
metadata:
    creationTimestamp: null
    name: workbc-mobile-app-analytics-build
labels:
    template: workbc-mobile-app-analytics-build
objects:
    - apiVersion: v1
      kind: ImageStream
      metadata:
          creationTimestamp: null
          labels:
              shared: "true"
          name: ${NAME}
      spec:
          lookupPolicy:
              local: false
    - apiVersion: v1
      kind: BuildConfig
      metadata:
          creationTimestamp: null
          name: ${NAME}${SUFFIX}
      spec:
          nodeSelector: null
          output:
              to:
                  kind: ImageStreamTag
                  name: ${NAME}:${TAG}
          resources:
              requests:
                  cpu: 200m
                  memory: 512Mi
              limits:
                  cpu: "2"
                  memory: 2Gi
          source:
              git:
                  uri: ${SOURCE_REPOSITORY_URL}
                  ref: ${SOURCE_REPOSITORY_REF}
              contextDir: ${SOURCE_CONTEXT_DIR}
              type: Git
              sourceSecret:
                  name: ${GIT_SOURCE_SECRET}
          strategy:
              type: Docker
              dockerStrategy:
                  dockerfilePath: ${DOCKERFILE_PATH}
          triggers:
              - type: ConfigChange
parameters:
    - description: A name used for all objects
      displayName: Name
      name: NAME
      required: true
      value: workbc-mobile-app-analytics
    - description: A name suffix used for all objects
      displayName: Suffix
      name: SUFFIX
      required: false
      value: ""
    - description: Tag used for the image tags
      displayName: Tag
      name: TAG
      required: true
      value: latest
    - description: Git repository URL (SSH recommended if using sourceSecret)
      displayName: Source repository URL
      name: SOURCE_REPOSITORY_URL
      required: true
      value: git@github.com:bcgov/workbc-mobile-app-analytics.git
    - description: Git branch or tag to build
      displayName: Source repository ref
      name: SOURCE_REPOSITORY_REF
      required: true
      value: main
    - description: Subdirectory of the repo used as Docker build context (`.` = repository root)
      displayName: Source context directory
      name: SOURCE_CONTEXT_DIR
      required: false
      value: "."
    - description: Path to the Dockerfile within the build context
      displayName: Dockerfile path
      name: DOCKERFILE_PATH
      required: true
      value: Dockerfile
    - description: Secret name holding Git credentials (ssh secret or basic auth) for private clones
      displayName: Git source secret
      name: GIT_SOURCE_SECRET
      required: true
      value: workbc-mobile-app-analytics
